<!DOCTYPE html>
<html lang="ja" data-theme="light">

<head>
    <!-- meta -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, shrink-to-fit=yes">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- molkkyprime -->
    <link rel="stylesheet" href="../my-bulma-project.css">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet"
        href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <script src="../script/script.js"></script>
    <script src="../script/match/match.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C4W483V0S8"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-C4W483V0S8');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8922718369591652"
        crossorigin="anonymous"></script>

    <title>試合結果｜モルック関東プライムリーグ</title>
</head>

<body>
    <header id="mkpl-header" class="bd-header">
    </header>

    <div class="container is-max-desktop">

        <section class="section">
            <nav class="breadcrumb pt-4 m-0" aria-label="breadcrumbs">
                <ul class="is-size-6">
                    <li><a href="../">トップ</a></li>
                    <li class="is-active"><a href="./" aria-current="page">試合結果</a></li>
                </ul>
            </nav>
        </section>

        <div class="container">
            <!-- Title -->
            <section class="hero is-medium mkpl-bg-cover is-dark">
                <div class="hero-body mkpl-bg-filter">
                    <h1 class="title is-size-2 mkpl-title">試合結果
                        <p class="subtitle">match result</p>
                    </h1>
                </div>
            </section>
        </div>

        <!-- Match -->
        <section class="section">
            <div class="content">
                <h3 id="match-result-title" class="title is-size-4">試合結果</h3>
                <p id="match-season-name" class="content is-size-6"></p>
                <p id="match-match-name" class="content is-size-6"></p>

                <div id="match-progress"><progress class="progress is-small is-light" max="100"></progress></div>

                <div class="columns is-mobile is-gapless is-vcentered content">
                    <div class="column is-5 has-text-left">
                        <small class="is-size-7"><strong class="has-text-primary">HOME</strong></small>
                        <p class="is-size-6 my-1"><strong id="match-home-cname"></strong></p>
                        <small class="is-size-7"><strong id="match-home-players"></strong></small>
                    </div>
                    <div class="column is-1 has-text-center">
                        <strong id="match-home-set-score" class="is-size-4"></strong>
                    </div>
                    <div class="column is-1 has-text-center">
                        <strong id="match-away-set-score" class="is-size-4"></strong>
                    </div>
                    <div class="column is-5 has-text-right">
                        <small class="is-size-7"><strong>AWAY</strong></small>
                        <p class="is-size-6 my-1"><strong id="match-away-cname"></strong></p>
                        <small class="is-size-7"><strong id="match-away-players"></strong></small>
                    </div>
                </div>

                <div class="table-container content">
                    <div id="match-overview-table"></div>
                    <div id="match-set-tables"></div>
                    <div id="match-player-stats"></div>
                </div>
                <p id="match-spreadsheet-url" class="is-size-7"></p>
            </div>
        </section>

        <section class="section">
            <div class="card content" id="card-result">
            </div>
            <div class="card content" id="card-before">
            </div>
            <div class="card content" id="card-after">
            </div>
        </section>
    </div>

    <!-- Footer -->
    <div class="container footer is-max-desktop">
        <footer class="footer" id="mkpl-footer">
        </footer>
    </div>
</body>

</html>
